
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOSS SMC 15M PRO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>BOSS SMC 15M PRO</h1>

<select id="market">
<option value="^NSEI">NIFTY 50</option>
<option value="^NSEBANK">BANKNIFTY</option>
<option value="^BSESN">SENSEX</option>
</select>

<button onclick="loadMarket()">Load Market</button>

<div class="card">
<h2>Trend & SMC</h2>
<p id="trend"></p>
<p id="structure"></p>
<p id="ob"></p>
</div>

<div class="card">
<h2>Tomorrow Bias</h2>
<p id="bias"></p>
<p id="prob"></p>
</div>

<div class="card">
<h2>Trade Setup</h2>
<p id="entry"></p>
<p id="sl"></p>
<p id="target"></p>
</div>

<div class="card">
<h2>Backtest</h2>
<p id="bt"></p>
</div>

<script src="app.js"></script>
</body>
</html>
